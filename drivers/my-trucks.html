<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FuelGuard Pro | My Trucks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-orange: #ff6b35;
            --orange-dark: #e0551f;
            --orange-light: #ff9b6e;
            --deep-teal: #1e3a3f;
            --dark-accent: #0f2c30;
            --warm-cream: #fef9ef;
            --sand-gray: #e6dfd1;
            --shadow-card: 0 20px 35px -12px rgba(0,0,0,0.1);
            --glass-bg: rgba(255, 253, 245, 0.92);
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(145deg, #f6efdf 0%, #e8dfcd 100%);
            min-height: 100vh;
            color: #2c241a;
        }

        .driver-sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, var(--deep-teal) 0%, var(--dark-accent) 100%);
            border-right: 1px solid rgba(255,107,53,0.3);
            display: flex;
            flex-direction: column;
            z-index: 1100;
            transition: all 0.25s;
            overflow-y: auto;
        }
        .sidebar-header {
            padding: 28px 24px 20px;
            border-bottom: 1px solid rgba(255,107,53,0.3);
            margin-bottom: 20px;
        }
        .sidebar-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--orange-light), var(--primary-orange));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sidebar-header p {
            font-size: 11px;
            color: var(--orange-light);
            margin-top: 6px;
        }
        .driver-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 16px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #cbdfcc;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item i { width: 24px; font-size: 1.2rem; text-align: center; }
        .nav-item:hover { background: rgba(255,107,53,0.2); color: var(--orange-light); transform: translateX(6px); }
        .nav-item.active {
            background: linear-gradient(95deg, rgba(255,107,53,0.25), rgba(255,107,53,0.08));
            color: var(--primary-orange);
            border-left: 3px solid var(--primary-orange);
        }
        .sidebar-footer {
            margin: 20px 16px 28px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,107,53,0.2);
        }
        .logout-action {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(220,38,38,0.1);
            border-radius: 14px;
            color: #fca5a5;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-action:hover { background: rgba(220,38,38,0.2); color: #ffcdcd; }

        .dashboard-main {
            margin-left: 260px;
            padding: 26px 34px;
            min-height: 100vh;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            padding: 14px 24px;
            border-radius: 48px;
            border: 1px solid rgba(255,107,53,0.2);
        }
        .welcome h2 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(130deg, var(--deep-teal), var(--primary-orange));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .welcome p {
            font-size: 13px;
            color: #7a7060;
            margin-top: 4px;
        }
        .btn-primary {
            background: var(--primary-orange);
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover { background: var(--orange-dark); transform: translateY(-2px); }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary-orange);
            color: var(--deep-teal);
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .btn-outline:hover { background: rgba(255,107,53,0.1); }

        .trucks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }
        .truck-card {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            border: 1px solid rgba(255,107,53,0.15);
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }
        .truck-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-card);
            border-color: var(--primary-orange);
        }
        .truck-header {
            background: linear-gradient(135deg, rgba(30,58,63,0.08), rgba(255,107,53,0.08));
            padding: 20px;
            border-bottom: 1px solid rgba(255,107,53,0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .truck-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-orange), var(--orange-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }
        .truck-info h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--deep-teal);
            margin-bottom: 4px;
        }
        .truck-id {
            font-size: 11px;
            color: var(--primary-orange);
            font-weight: 600;
        }
        .truck-body {
            padding: 20px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(0,0,0,0.08);
        }
        .detail-label {
            color: #7a7060;
            font-size: 12px;
            font-weight: 500;
        }
        .detail-value {
            font-weight: 600;
            color: #2e2922;
            font-size: 12px;
        }
        .fuel-indicator {
            margin-top: 12px;
            padding: 8px;
            background: rgba(255,107,53,0.08);
            border-radius: 12px;
        }
        .fuel-bar-container {
            width: 100%;
            background: #e2dcd0;
            border-radius: 20px;
            height: 8px;
            margin-top: 8px;
            overflow: hidden;
        }
        .fuel-bar {
            background: var(--primary-orange);
            height: 100%;
            border-radius: 20px;
            transition: width 0.3s;
        }
        .fuel-bar.critical { background: #dc2626; }
        .fuel-bar.warning { background: #f59e0b; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-active { background: #d1fae5; color: #065f46; }
        .status-maintenance { background: #fed7aa; color: #92400e; }
        .status-idle { background: #e0e7ff; color: #3730a3; }
        
        .truck-actions {
            padding: 16px 20px 20px;
            display: flex;
            gap: 12px;
            border-top: 1px solid rgba(255,107,53,0.1);
        }
        .action-btn {
            flex: 1;
            padding: 8px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            background: rgba(255,107,53,0.1);
            border: none;
            color: var(--primary-orange);
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: var(--primary-orange);
            color: white;
        }
        
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
        }
        .custom-modal-overlay.active { visibility: visible; opacity: 1; }
        .custom-modal {
            background: #fffcf5;
            border-radius: 32px;
            max-width: 500px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.3s;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .custom-modal-overlay.active .custom-modal { transform: scale(1); }
        .custom-modal-header {
            background: linear-gradient(135deg, var(--deep-teal), var(--dark-accent));
            padding: 20px 24px;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .custom-modal-header i { font-size: 28px; color: var(--primary-orange); }
        .custom-modal-header h3 { font-size: 1.3rem; font-weight: 700; margin: 0; }
        .custom-modal-body { padding: 24px; max-height: 60vh; overflow-y: auto; }
        .custom-modal-body p { margin: 8px 0; line-height: 1.5; color: #4a3f2c; }
        .custom-modal-footer {
            padding: 16px 24px 24px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid #e0d8c8;
        }
        .modal-btn {
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .modal-btn-primary {
            background: var(--primary-orange);
            color: white;
        }
        .modal-btn-primary:hover { background: var(--orange-dark); transform: translateY(-1px); }
        .modal-btn-secondary {
            background: #e0d8c8;
            color: #5a5244;
        }
        .modal-btn-secondary:hover { background: #d0c8b8; }
        .modal-input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e0d8c8;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            margin-top: 12px;
            font-size: 14px;
        }
        .modal-input:focus {
            outline: none;
            border-color: var(--primary-orange);
        }
        .photo-preview {
            background: #f0ebe2;
            border-radius: 20px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px 0;
            overflow: hidden;
        }
        .photo-preview img { max-width: 100%; max-height: 200px; object-fit: contain; }
        .photo-buttons { display: flex; gap: 12px; margin-bottom: 16px; }
        .photo-btn {
            background: var(--deep-teal);
            border: none;
            padding: 10px 16px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .camera-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin: 16px 0;
        }
        .camera-feed {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: cover;
        }
        .camera-controls {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        
        .footer-bar {
            margin-top: 32px;
            background: rgba(255,252,240,0.8);
            border-radius: 30px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #6b5b48;
        }
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--deep-teal);
            color: white;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 13px;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast-message.show { opacity: 1; }
        .toast-message.success { background: #1a472a; }
        .toast-message.error { background: #dc2626; }
        
        @media (max-width: 768px) {
            .driver-sidebar { width: 80px; }
            .driver-sidebar .sidebar-header h1, .driver-sidebar .sidebar-header p, .nav-item span { display: none; }
            .driver-sidebar .nav-item { justify-content: center; }
            .logout-action span { display: none; }
            .dashboard-main { margin-left: 80px; padding: 20px; }
            .trucks-grid { grid-template-columns: 1fr; }
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,107,53,0.2);
            border-top-color: var(--primary-orange);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<aside class="driver-sidebar">
    <div class="sidebar-header">
        <h1><i class="fas fa-gas-pump"></i> FuelGuard</h1>
        <p>DRIVER PORTAL</p>
    </div>
    <div class="driver-nav">
        <a href="driver-dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
        <a href="my-trucks.html" class="nav-item active"><i class="fas fa-truck"></i><span>My Trucks</span></a>
        <a href="accidents.html" class="nav-item"><i class="fas fa-car-crash"></i><span>Accidents</span></a>
        <a href="alerts.html" class="nav-item"><i class="fas fa-bell"></i><span>Alerts</span></a>

<main class="dashboard-main">

            <p><i class="fas fa-map-marker-alt"></i> View and manage your assigned vehicles</p>

            <div class="loading-spinner"></div>
            <p style="margin-top:16px;">Loading your trucks...</p>

        <span><i class="fas fa-clock"></i> <span id="liveTime"></span></span>

</main>

<!-- Refueling Modal -->
<div id="refuelModal" class="custom-modal-overlay">
    <div class="custom-modal">
        <div class="custom-modal-header">
            <i class="fas fa-gas-pump"></i>
            <h3>Record Refueling</h3>
        </div>
        <div class="custom-modal-body">

            <button class="modal-btn modal-btn-secondary" id="cancelRefuelBtn">Cancel</button>
            <button class="modal-btn modal-btn-primary" id="submitRefuelBtn">Submit Refueling Record</button>
        </div>
    </div>
</div>

<!-- Camera Modal for Receipt -->
<div id="cameraModal" class="custom-modal-overlay">
    <div class="custom-modal" style="max-width: 500px;">
        <div class="custom-modal-header">
            <i class="fas fa-camera"></i>
            <h3>Take Photo of Receipt</h3>
        </div>
        <div class="custom-modal-body">
            <div class="camera-container">
                <video id="cameraFeed" class="camera-feed" autoplay playsinline></video>

<!-- Truck Details Modal -->

    <div class="custom-modal">
        <div class="custom-modal-header">
            <i class="fas fa-truck"></i>
            <h3 id="truckModalTitle">Truck Details</h3>
        </div>
        <div class="custom-modal-body" id="truckModalBody"></div>
        <div class="custom-modal-footer">
            <button class="modal-btn modal-btn-primary" id="closeTruckModalBtn">Close</button>
        </div>

</div>

<!-- General Custom Modal -->
<div id="customModal" class="custom-modal-overlay">
    <div class="custom-modal">
        <div class="custom-modal-header" id="modalHeaderIcon">
            <i class="fas fa-info-circle"></i>
            <h3 id="modalTitle">Modal Title</h3>
        </div>
        <div class="custom-modal-body" id="modalBody"></div>
        <div class="custom-modal-footer" id="modalFooter">
            <button class="modal-btn modal-btn-secondary" id="modalCancelBtn">Cancel</button>
            <button class="modal-btn modal-btn-primary" id="modalConfirmBtn">Confirm</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-message"></div>

<script>
    const SUPABASE_URL = 'https://shdaldiqnbtlgjajxroi.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoZGFsZGlxbmJ0bGdqYWp4cm9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMzA0MTcsImV4cCI6MjA5NDYwNjQxN30.BDRnisUkar6CaBKc0-AI6IXw16yfgjrkqEv59PWkJIo';
    
    let currentDriver = null;
    let trucks = [];
    let currentTruckForRefuel = null;
    let capturedRefuelImage = null;
    let cameraStream = null;
    
    function showToast(message, type = 'success') {
        const toast = document.getElementById('toastMsg');
        toast.textContent = message;
        toast.className = 'toast-message ' + type;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    function getSession() {
        const session = localStorage.getItem('fuelguard_session') || sessionStorage.getItem('fuelguard_session');
        if (session) {
            try {
                currentDriver = JSON.parse(session);
                return currentDriver;
            } catch(e) {
                console.error('Session parse error:', e);
            }
        }
        return null;
    }
    
    function checkAuth() {
        const driver = getSession();
        if (!driver) {
            window.location.href = 'driver-login.html';
            return false;
        }
        if (driver.expires_at && new Date(driver.expires_at) < new Date()) {
            localStorage.removeItem('fuelguard_session');
            sessionStorage.removeItem('fuelguard_session');
            window.location.href = 'driver-login.html';
            return false;
        }
        return true;
    }
    
    function endShift() {
        if (confirm('Are you sure you want to end your shift? You will be logged out.')) {
            localStorage.removeItem('fuelguard_session');
            sessionStorage.removeItem('fuelguard_session');
            showToast('Shift ended! Redirecting...', 'success');
            setTimeout(() => window.location.href = 'driver-login.html', 1500);
        }
    }
    
    async function fetchTrucks() {
        if (!currentDriver) return [];
        
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/trucks?select=*`, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                }
            });
            
            if (response.ok) {
                const allTrucks = await response.json();
                const assignedTrucks = allTrucks.filter(truck => 
                    truck.assigned_driver_id === currentDriver.driver_id ||
                    truck.driver_id === currentDriver.driver_id ||
                    truck.driver_email === currentDriver.email
                );
                return assignedTrucks;
            }
            return [];
        } catch (error) {
            console.error('Error fetching trucks:', error);
            return [];
        }
    }
    
    function getFuelBarClass(fuelLevel) {
        if (fuelLevel <= 15) return 'critical';
        if (fuelLevel <= 30) return 'warning';
        return '';
    }
    
    function getStatusBadge(status) {
        const statusLower = (status || '').toLowerCase();
        if (statusLower === 'active' || statusLower === 'activo') {
            return '<span class="status-badge status-active"><i class="fas fa-check-circle"></i> ACTIVE</span>';
        } else if (statusLower === 'maintenance' || statusLower === 'mantenimiento') {
            return '<span class="status-badge status-maintenance"><i class="fas fa-tools"></i> MAINTENANCE</span>';
        } else {
            return '<span class="status-badge status-idle"><i class="fas fa-clock"></i> IDLE</span>';
        }
    }
    
    function renderTrucks() {
        const grid = document.getElementById('trucksGrid');
        if (!trucks || trucks.length === 0) {
            grid.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; padding:60px;">
                    <i class="fas fa-truck" style="font-size:48px; color:#b8a88c;"></i>
                    <p style="margin-top:16px; font-size:16px;">No trucks assigned to you yet.</p>
                    <p style="margin-top:8px; font-size:13px; color:#7a7060;">Please contact your fleet manager to get a truck assigned.</p>
                </div>
            `;
            return;
        }
        
        grid.innerHTML = trucks.map(truck => {
            const fuelLevel = truck.fuel_level || truck.fuel || 0;
            const fuelBarClass = getFuelBarClass(fuelLevel);
            const truckName = truck.truck_name || truck.truck_id || 'Unknown Truck';
            const licensePlate = truck.license_plate || truck.plate_number || 'N/A';
            const mileage = truck.current_mileage_km || truck.mileage || 0;
            const status = truck.status || 'ACTIVE';
            const truckId = truck.truck_id || truck.id;
            
            return `
                <div class="truck-card">
                    <div class="truck-header" onclick="showTruckDetails('${truckId}')">
                        <div class="truck-icon"><i class="fas fa-truck-moving"></i></div>
                        <div class="truck-info">
                            <h3>${escapeHtml(truckName)}</h3>
                            <div class="truck-id">ID: ${escapeHtml(truckId)}</div>
                        </div>
                        ${getStatusBadge(status)}
                    </div>
                    <div class="truck-body">
                        <div class="detail-row">
                            <span class="detail-label"><i class="fas fa-hashtag"></i> License Plate</span>
                            <span class="detail-value">${escapeHtml(licensePlate)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label"><i class="fas fa-tachometer-alt"></i> Mileage</span>
                            <span class="detail-value">${mileage.toLocaleString()} km</span>
                        </div>
                        <div class="fuel-indicator">
                            <div class="detail-row">
                                <span class="detail-label"><i class="fas fa-fuel-pump"></i> Fuel Level</span>
                                <span class="detail-value"><strong style="color: ${fuelLevel <= 15 ? '#dc2626' : fuelLevel <= 30 ? '#f59e0b' : '#1a472a'};">${fuelLevel}%</strong></span>
                            </div>
                            <div class="fuel-bar-container">
                                <div class="fuel-bar ${fuelBarClass}" style="width: ${fuelLevel}%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="truck-actions">
                        <button class="action-btn" onclick="event.stopPropagation(); openRefuelModal('${truckId}')">
                            <i class="fas fa-gas-pump"></i> Record Refuel
                        </button>
                        <button class="action-btn" onclick="event.stopPropagation(); reportIssue('${truckId}')">
                            <i class="fas fa-exclamation-triangle"></i> Report Issue
                        </button>
                        <button class="action-btn" onclick="event.stopPropagation(); viewLocation('${truckId}')">
                            <i class="fas fa-map-marker-alt"></i> Location
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    async function loadTrucks() {
        if (!checkAuth()) return;
        
        const grid = document.getElementById('trucksGrid');
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px;"><div class="loading-spinner"></div><p style="margin-top:16px;">Loading your trucks...</p></div>';
        
        trucks = await fetchTrucks();
        renderTrucks();
        
        if (trucks.length > 0) {
            showToast(`Loaded ${trucks.length} truck(s)`, 'success');
        }
    }
    
    function showTruckDetails(truckId) {
        const truck = trucks.find(t => (t.truck_id || t.id) == truckId);
        if (!truck) return;
        
        const fuelLevel = truck.fuel_level || truck.fuel || 0;
        const fuelWarning = fuelLevel <= 15 ? '⚠️ CRITICAL - Refuel Immediately!' : 
                          fuelLevel <= 30 ? '⚠️ Low Fuel - Plan to refuel soon' : 
                          '✓ Fuel level adequate';
        const fuelColor = fuelLevel <= 15 ? '#dc2626' : fuelLevel <= 30 ? '#f59e0b' : '#10b981';
        
        const modalContent = `
            <div style="margin-bottom: 12px;">
                <strong>🚛 Truck ID:</strong> ${escapeHtml(truck.truck_id || truck.id)}
            </div>
            <div style="margin-bottom: 12px;">
                <strong>📋 License Plate:</strong> ${escapeHtml(truck.license_plate || truck.plate_number || '—')}
            </div>
            <div style="margin-bottom: 12px;">
                <strong>🎨 Color:</strong> ${escapeHtml(truck.color || '—')}
            </div>
            <div style="margin-bottom: 12px;">
                <strong>📊 Current Mileage:</strong> ${(truck.current_mileage_km || truck.mileage || 0).toLocaleString()} km
            </div>
            <div style="margin-bottom: 12px;">
                <strong>⛽ Tank Capacity:</strong> ${truck.tank_capacity_liters || 300} liters
            </div>
            <div style="margin-bottom: 12px;">
                <strong>⛽ Fuel Level:</strong> <span style="color: ${fuelColor}; font-weight: bold;">${fuelLevel}%</span> - ${fuelWarning}
            </div>
            <div class="fuel-bar-container" style="margin: 12px 0;">
                <div class="fuel-bar ${fuelLevel <= 15 ? 'critical' : fuelLevel <= 30 ? 'warning' : ''}" style="width: ${fuelLevel}%"></div>
            </div>
            <div style="margin-bottom: 12px;">
                <strong>📌 Status:</strong> ${getStatusBadge(truck.status)}
            </div>
        `;
        
        document.getElementById('truckModalBody').innerHTML = modalContent;
        document.getElementById('truckModal').classList.add('active');
    }
    
    function reportIssue(truckId) {
        const truck = trucks.find(t => (t.truck_id || t.id) == truckId);
        
        const modalContent = `
            <p><strong>Truck:</strong> ${escapeHtml(truck?.truck_name || truckId)}</p>
            <p><strong>Select Issue Type:</strong></p>
            <div class="radio-group" id="issueTypeGroup">
                <label class="radio-option"><input type="radio" name="issueType" value="Mechanical Issue"> 🔧 Mechanical Issue</label>
                <label class="radio-option"><input type="radio" name="issueType" value="Electrical Issue"> ⚡ Electrical Issue</label>
                <label class="radio-option"><input type="radio" name="issueType" value="Tire Problem"> 🚗 Tire Problem</label>
                <label class="radio-option"><input type="radio" name="issueType" value="Brake Issue"> 🛑 Brake Issue</label>
                <label class="radio-option"><input type="radio" name="issueType" value="Other"> 📝 Other</label>
            </div>
            <textarea id="issueDescription" class="modal-input" rows="3" placeholder="Describe the issue in detail..."></textarea>
        `;
        
        showCustomModal('Report Issue', modalContent, 'exclamation-triangle', 'Submit Report', 'Cancel', () => {
            const selectedRadio = document.querySelector('input[name="issueType"]:checked');
            const description = document.getElementById('issueDescription')?.value;
            
            if (!selectedRadio) {
                showToast('Please select an issue type', 'error');
                return false;
            }
            if (!description?.trim()) {
                showToast('Please provide a description', 'error');
                return false;
            }
            
            showToast(`Issue reported: ${selectedRadio.value}`, 'success');
            return true;
        });
    }
    
    function viewLocation(truckId) {
        const truck = trucks.find(t => (t.truck_id || t.id) == truckId);
        
        const modalContent = `
            <p><strong>Truck:</strong> ${escapeHtml(truck?.truck_name || truckId)}</p>
            <div style="background: linear-gradient(135deg, #1e3a3f, #0f2c30); padding: 20px; border-radius: 20px; color: white; text-align: center; margin-top: 10px;">
                <i class="fas fa-map-marker-alt" style="font-size: 48px; color: var(--primary-orange); margin-bottom: 10px;"></i>
                <p><strong>📍 Last Known Location</strong></p>
                <p>Fleet Yard - Main Depot</p>
                <hr style="margin: 12px 0; border-color: rgba(255,255,255,0.2);">
                <p><i class="fas fa-satellite-dish"></i> GPS Status: <span style="color: #10b981;">Active</span></p>
                <p><i class="fas fa-mobile-alt"></i> Real-time tracking available on mobile app</p>
            </div>
            <p style="margin-top: 12px; font-size: 12px; text-align: center;">Contact dispatch for exact coordinates: <strong>#HELP</strong></p>
        `;
        
        showCustomModal('Location Tracking', modalContent, 'map-marker-alt', 'Close', '', () => true);
    }
    
    function showCustomModal(title, message, icon, confirmText, cancelText, onConfirm) {
        const modal = document.getElementById('customModal');
        const headerIcon = document.getElementById('modalHeaderIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const footer = document.getElementById('modalFooter');
        
        headerIcon.innerHTML = `<i class="fas fa-${icon}"></i>`;
        modalTitle.innerText = title;
        modalBody.innerHTML = typeof message === 'string' ? `<p>${message}</p>` : message;
        
        footer.innerHTML = `
            ${cancelText ? `<button class="modal-btn modal-btn-secondary" id="modalCancelBtn">${cancelText}</button>` : ''}
            ${confirmText ? `<button class="modal-btn modal-btn-primary" id="modalConfirmBtn">${confirmText}</button>` : ''}
        `;
        
        if (confirmText) {
            const confirmBtn = document.getElementById('modalConfirmBtn');
            if (confirmBtn) {
                confirmBtn.onclick = () => {
                    if (onConfirm()) {
                        modal.classList.remove('active');
                    }
                };
            }
        }
        
        if (cancelText) {
            const cancelBtn = document.getElementById('modalCancelBtn');
            if (cancelBtn) {
                cancelBtn.onclick = () => {
                    modal.classList.remove('active');
                };
            }
        }
        
        modal.classList.add('active');
    }
    
    // REFUELING FUNCTIONS
    function openRefuelModal(truckId) {
        currentTruckForRefuel = trucks.find(t => (t.truck_id || t.id) == truckId);
        document.getElementById('refuelModal').classList.add('active');
        resetRefuelForm();
        
        const odometer = currentTruckForRefuel?.current_mileage_km || currentTruckForRefuel?.mileage || 0;
        if (odometer > 0) {
            document.getElementById('refuelOdometer').value = odometer;
        }
    }
    
    function resetRefuelForm() {
        capturedRefuelImage = null;
        document.getElementById('refuelPhotoPreview').innerHTML = '<i class="fas fa-camera" style="font-size:48px; color:#c4b7a2;"></i>';
        document.getElementById('refuelLocation').value = '';
        document.getElementById('refuelAmount').value = '';
        document.getElementById('refuelCost').value = '';
        document.getElementById('refuelOdometer').value = '';
    }
    
    async function startCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: true });
            const video = document.getElementById('cameraFeed');
            video.srcObject = cameraStream;
        } catch (err) {
            console.error('Camera error:', err);
            showToast('Cannot access camera. Please check permissions.', 'error');
        }
    }
    
    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
        const video = document.getElementById('cameraFeed');
        if (video) video.srcObject = null;
    }
    
    function capturePhoto() {
        const video = document.getElementById('cameraFeed');
        const canvas = document.getElementById('cameraCanvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL('image/jpeg', 0.8);
        capturedRefuelImage = imageData;
        
        const preview = document.getElementById('refuelPhotoPreview');
        preview.innerHTML = `<img src="${capturedRefuelImage}" style="max-width:100%; max-height:180px; object-fit:contain;">`;
        
        closeCameraModal();
        showToast('Photo captured successfully!', 'success');
    }
    
    function openCameraModal() {
        document.getElementById('cameraModal').classList.add('active');
        startCamera();
    }
    
    function closeCameraModal() {
        document.getElementById('cameraModal').classList.remove('active');
        stopCamera();
    }
    
    function handleImageUpload(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            capturedRefuelImage = e.target.result;
            const preview = document.getElementById('refuelPhotoPreview');
            preview.innerHTML = `<img src="${capturedRefuelImage}" style="max-width:100%; max-height:180px; object-fit:contain;">`;
        };
        reader.readAsDataURL(file);
    }
    
    function dataURLtoBlob(dataURL) {
        const arr = dataURL.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) { u8arr[n] = bstr.charCodeAt(n); }
        return new Blob([u8arr], { type: mime });
    }
    
    async function uploadRefuelImage() {
        if (!capturedRefuelImage) return null;
        const fileName = `refuel_${currentDriver.driver_id}_${Date.now()}.jpg`;
        const blob = dataURLtoBlob(capturedRefuelImage);
        const formData = new FormData();
        formData.append('file', blob, fileName);
        
        try {
            // First create the bucket if it doesn't exist
            const response = await fetch(`${SUPABASE_URL}/storage/v1/object/refuel_receipts/${fileName}`, {
                method: 'POST',
                headers: { 
                    'apikey': SUPABASE_KEY, 
                    'Authorization': `Bearer ${SUPABASE_KEY}` 
                },
                body: formData
            });
            
            if (response.ok) {
                return `${SUPABASE_URL}/storage/v1/object/public/refuel_receipts/${fileName}`;
            } else {
                // Try alternative bucket name
                const altResponse = await fetch(`${SUPABASE_URL}/storage/v1/object/refueling_photos/${fileName}`, {
                    method: 'POST',
                    headers: { 
                        'apikey': SUPABASE_KEY, 
                        'Authorization': `Bearer ${SUPABASE_KEY}` 
                    },
                    body: formData
                });
                
                if (altResponse.ok) {
                    return `${SUPABASE_URL}/storage/v1/object/public/refueling_photos/${fileName}`;
                }
            }
        } catch (error) {
            console.error('Upload error:', error);
        }
        return null;
    }
    
    async function submitRefueling() {
        const location = document.getElementById('refuelLocation').value.trim();
        const amountLiters = parseFloat(document.getElementById('refuelAmount').value);
        const cost = parseFloat(document.getElementById('refuelCost').value);
        const odometerKm = parseFloat(document.getElementById('refuelOdometer').value);
        
        // Validation
        if (!location) {
            showToast('Please enter gas station location', 'error');
            return;
        }
        if (!amountLiters || amountLiters <= 0) {
            showToast('Please enter valid amount in liters', 'error');
            return;
        }
        if (!cost || cost <= 0) {
            showToast('Please enter total cost', 'error');
            return;
        }
        if (!odometerKm || odometerKm <= 0) {
            showToast('Please enter current odometer reading', 'error');
            return;
        }
        
        const submitBtn = document.getElementById('submitRefuelBtn');
        submitBtn.innerHTML = '<div class="loading-spinner"></div> Submitting...';
        submitBtn.disabled = true;
        
        try {
            let photoUrl = null;
            if (capturedRefuelImage) {
                photoUrl = await uploadRefuelImage();
                if (photoUrl) {
                    showToast('Photo uploaded successfully', 'success');
                }
            }
            
            const previousFuelLevel = currentTruckForRefuel.fuel_level || 0;
            const estimatedNewLevel = Math.min(100, previousFuelLevel + (amountLiters / 5));
            
            // Only include columns that exist in your table
            const refuelData = {
                truck_id: currentTruckForRefuel.truck_id || currentTruckForRefuel.id,
                amount_liters: amountLiters,
                cost: cost,
                location: location,
                odometer_km: odometerKm,
                refueled_by: currentDriver.full_name || currentDriver.name,
                previous_fuel_level: previousFuelLevel,
                new_fuel_level: estimatedNewLevel,
                created_at: new Date().toISOString()
            };
            
            console.log('Submitting refuel data:', refuelData);
            
            const response = await fetch(`${SUPABASE_URL}/rest/v1/refueling_events`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(refuelData)
            });
            
            console.log('Response status:', response.status);
            
            if (response.ok || response.status === 201) {
                showToast(`✓ Refueling recorded! ${amountLiters}L at ${location}`, 'success');
                document.getElementById('refuelModal').classList.remove('active');
                resetRefuelForm();
                
                // Update truck fuel level
                await fetch(`${SUPABASE_URL}/rest/v1/trucks?truck_id=eq.${currentTruckForRefuel.truck_id || currentTruckForRefuel.id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ fuel_level: Math.round(estimatedNewLevel) })
                });
                
                loadTrucks();
            } else {
                const errorText = await response.text();
                console.error('Server error:', errorText);
                showToast(`Error: ${errorText.substring(0, 100)}`, 'error');
            }
        } catch (error) {
            console.error('Error saving refueling:', error);
            showToast('Network error. Please try again.', 'error');
        } finally {
            submitBtn.innerHTML = 'Submit Refueling Record';
            submitBtn.disabled = false;
        }
    }
    
    function updateTime() {
        document.getElementById('liveTime').innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateTime, 1000);
    updateTime();
    
    // Event Listeners
    document.getElementById('refreshBtn').addEventListener('click', loadTrucks);
    document.getElementById('logoutBtn').addEventListener('click', endShift);
    document.getElementById('closeTruckModalBtn').addEventListener('click', () => {
        document.getElementById('truckModal').classList.remove('active');
    });
    
    document.getElementById('takeRefuelPhotoBtn').addEventListener('click', openCameraModal);
    document.getElementById('uploadRefuelPhotoBtn').addEventListener('click', () => document.getElementById('refuelPhotoInput').click());
    document.getElementById('refuelPhotoInput').addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) handleImageUpload(e.target.files[0]);
    });
    document.getElementById('submitRefuelBtn').addEventListener('click', submitRefueling);
    document.getElementById('cancelRefuelBtn').addEventListener('click', () => {
        document.getElementById('refuelModal').classList.remove('active');
    });
    
    document.getElementById('closeCameraBtn').addEventListener('click', closeCameraModal);
    document.getElementById('capturePhotoBtn').addEventListener('click', capturePhoto);
    
    document.getElementById('refuelModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('refuelModal')) {
            document.getElementById('refuelModal').classList.remove('active');
        }
    });
    document.getElementById('cameraModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('cameraModal')) {
            closeCameraModal();
        }
    });
    document.getElementById('truckModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('truckModal')) {
            document.getElementById('truckModal').classList.remove('active');
        }
    });
    
    if (checkAuth()) {
        loadTrucks();
    }
</script>
</body>
