# Status Badge: [![FuelGuard CI](https://github.com/YOUR_USERNAME/YOUR_REPO/actions/workflows/ci.yml/badge.svg)](https://github.com/YOUR_USERNAME/YOUR_REPO/actions/workflows/ci.yml)

name: FuelGuard CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install flake8
      - name: Run linter
        run: flake8 gateway/ simulator/ --count --select=E9,F63,F7,F82 --show-source --statistics

  lint-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check PHP Syntax
        run: |
          for file in $(find api/*.php *.php -name "*.php"); do
            php -l "$file"
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Warning
        run: echo "⚠️ No formal test suite found — add pytest/phpunit before production deploy."

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Python security scan
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "Audit completed"
      - name: PHP Security Scan
        run: echo "Scan PHP dependencies if composer.json exists."

  build:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-php]
    steps:
      - uses: actions/checkout@v3
      - name: Build Gateway Image
        run: docker build -t fuelguard-gateway:latest -f infrastructure/docker/gateway/Dockerfile .
      - name: Build Backend Image
        run: docker build -t fuelguard-backend:latest -f infrastructure/docker/backend/Dockerfile .
